  :root{
    /* Polar Night */
    --nord0:#2e3440;
    --nord1:#3b4252;
    --nord2:#434c5e;
    --nord3:#4c566a;
    /* Snow Storm */
    --nord4:#d8dee9;
    --nord5:#e5e9f0;
    --nord6:#eceff4;
    /* Frost */
    --nord7:#8fbcbb;
    --nord8:#88c0d0;
    --nord9:#81a1c1;
    --nord10:#5e81ac;
    /* Aurora */
    --nord11:#bf616a;
    --nord12:#d08770;
    --nord13:#ebcb8b;
    --nord14:#a3be8c;
    --nord15:#b48ead;

    --bg:var(--nord0);
    --bg-2:#282e39;
    --panel:var(--nord1);
    --panel-2:var(--nord2);
    --border:var(--nord3);
    --paper:#2b3745;
    --paper-2:#334252;
    --paper-shadow:rgba(0,0,0,0.45);
    --ink:var(--nord6);
    --ink-soft:var(--nord4);
    --text:var(--nord4);
    --text-dim:#a7b3c6;
    --text-faint:#697c9a;
    --brass:var(--nord13);
    --brass-soft:#f1dfab;
    --rose:var(--nord11);
    --blue:var(--nord10);
    --danger:var(--nord11);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 15% 0%, #333c4c 0%, transparent 55%),
      radial-gradient(ellipse at 85% 100%, #232935 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    letter-spacing:0.01em;
  }
  .app{
    display:flex;
    min-height:100vh;
    max-width:1400px;
    margin:0 auto;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:300px;
    flex:0 0 300px;
    padding:28px 18px 28px 24px;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:18px;
    height:100vh;
    position:sticky;
    top:0;
    align-self:flex-start;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:4px;
  }
  .brand h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-style:italic;
    font-size:26px;
    margin:0;
    color:var(--brass-soft);
    letter-spacing:0.01em;
  }
  .brand span{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-faint);
    text-transform:uppercase;
    letter-spacing:0.12em;
  }

  .search-box{
    position:relative;
  }
  .search-box input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:10px 12px 10px 34px;
    border-radius:3px;
    outline:none;
    transition:border-color .15s;
  }
  .search-box input::placeholder{color:var(--text-faint);}
  .search-box input:focus{border-color:var(--brass);}
  .search-box svg{
    position:absolute;
    left:11px;
    top:50%;
    transform:translateY(-50%);
    width:14px;
    height:14px;
    stroke:var(--text-faint);
  }

  .type-chips{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:5px 9px;
    border-radius:2px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text-dim);
    cursor:pointer;
    user-select:none;
    display:flex;
    align-items:center;
    gap:5px;
    transition:all .12s;
  }
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);}
  .chip.on{border-color:var(--brass); color:var(--brass-soft); background:var(--panel-2);}
  .chip.on .dot{background:var(--brass);}
  .chip[data-type="Note"].on .dot{background:var(--blue);}
  .chip[data-type="Unclassified"].on .dot{background:var(--text-dim);}

  .section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--text-faint);
    margin:6px 0 -4px 2px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .section-label button{
    background:none;
    border:none;
    color:var(--brass);
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    text-transform:none;
    letter-spacing:0;
    cursor:pointer;
    padding:0;
  }
  .book-sort-select{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    padding:7px 8px;
    border-radius:3px;
    outline:none;
    margin-top:-2px;
  }
  .book-sort-select:focus{border-color:var(--brass);}

  .book-list{
    overflow-y:auto;
    flex:1;
    min-height:0;
    margin-right:-8px;
    padding-right:8px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .book-row{
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 8px 8px 6px;
    border-radius:3px;
    cursor:pointer;
    border-left:3px solid transparent;
  }
  .book-row:hover{background:var(--panel);}
  .book-row.active{background:var(--panel-2);}
  .spine{
    width:6px;
    height:26px;
    border-radius:1px;
    flex:0 0 6px;
  }
  .book-meta{flex:1; min-width:0;}
  .book-title{
    font-size:12.5px;
    line-height:1.3;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .book-author{
    font-size:10.5px;
    color:var(--text-faint);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .book-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-faint);
    flex:0 0 auto;
  }
  .book-row.active .book-count{color:var(--brass-soft);}

  .dup-alert{
    font-size:11.5px;
    background:var(--panel);
    border:1px solid var(--border);
    border-left:3px solid var(--brass);
    padding:9px 10px;
    border-radius:3px;
    color:var(--text-dim);
    cursor:pointer;
  }
  .dup-alert b{color:var(--brass-soft); font-weight:600;}

  .sidebar-foot{
    display:flex;
    gap:8px;
  }
  .btn-ghost{
    flex:1;
    background:none;
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    padding:8px 10px;
    border-radius:3px;
    cursor:pointer;
    transition:border-color .12s;
  }
  .btn-ghost:hover{border-color:var(--text-dim);}

  /* ---------- Main ---------- */
  .main{
    flex:1;
    padding:28px 36px 40px 32px;
    min-width:0;
  }
  .stats-bar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border);
    margin-bottom:22px;
  }
  .stats-bar h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:21px;
    margin:0 0 4px 0;
    color:var(--text);
  }
  .stats-bar .sub{
    font-size:12px;
    color:var(--text-faint);
  }
  .stamp-row{display:flex; gap:22px;}
  .stamp{text-align:right;}
  .stamp .n{
    font-family:'IBM Plex Mono',monospace;
    font-size:19px;
    color:var(--brass-soft);
    display:block;
    line-height:1;
  }
  .stamp .l{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.1em;
    color:var(--text-faint);
  }

  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
    gap:12px;
    flex-wrap:wrap;
  }
  .toolbar select{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding:7px 10px;
    border-radius:3px;
    outline:none;
  }
  .toolbar .right{display:flex; gap:8px; align-items:center;}
  .icon-btn{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:7px 10px;
    border-radius:3px;
    font-size:12px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .icon-btn:hover{border-color:var(--brass); color:var(--brass-soft);}
  .icon-btn svg{width:13px;height:13px;}

  /* ---------- Clipping cards ---------- */
  .clip-list{display:flex; flex-direction:column; gap:20px;}
  .clip-card{
    background:var(--paper);
    color:var(--ink);
    border:1px solid rgba(216,222,233,0.08);
    border-radius:2px;
    padding:20px 22px 18px 22px;
    position:relative;
    box-shadow:0 10px 22px -8px var(--paper-shadow), 0 2px 5px -1px var(--paper-shadow);
    clip-path: polygon(0% 1.2%,3% 0%,9% 0.8%,15% 0%,22% 0.6%,29% 0%,36% 0.9%,43% 0%,50% 0.5%,57% 0%,64% 0.8%,71% 0%,78% 0.6%,85% 0%,92% 0.9%,97% 0%,100% 1%,100% 100%,0% 100%);
  }
  /* Removed slight per-card rotation — it was causing sub-pixel text blur */
  .clip-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    margin-bottom:10px;
  }
  .clip-book{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:14.5px;
    color:var(--ink);
    line-height:1.3;
  }
  .clip-author{
    font-family:'Inter',sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .type-tab{
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    padding:3px 8px;
    border-radius:2px;
    color:#fff;
    flex:0 0 auto;
    white-space:nowrap;
  }
  .type-tab.Highlight{background:#a98a4f; color:#2e3440;}
  .type-tab.Note{background:var(--nord10);}
  .type-tab.Unclassified{background:var(--nord3); color:var(--text-dim);}

  .clip-text{
    font-family:'Lora',serif;
    font-size:15.5px;
    line-height:1.62;
    color:var(--ink);
  }
  .clip-text.empty{
    font-style:italic;
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-size:12.5px;
  }
  mark{
    background:var(--nord13);
    color:var(--nord0);
    border-radius:1px;
    padding:0 1px;
  }
  .clip-note-body{
    margin-top:8px;
    padding:9px 11px;

  /* ---------- Empty / drop states ---------- */

  .dropzone h3{

  }
  .dropzone p{font-size:13px; color:var(--text-faint); margin:0 0 20px 0; line-height:1.6;}
  .file-label{
    display:inline-block;
    background:var(--brass);
    color:var(--nord0);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    padding:10px 20px;

  .file-label:hover{background:var(--brass-soft);}
  input[type=file]{display:none;}
  .no-results{
    text-align:center;
    color:var(--text-faint);
    padding:60px 20px;
    font-size:13px;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(10,15,12,0.7);
    display:flex; align-items:center; justify-content:center;
    z-index:50;

  .modal{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:22px 24px;
    width:520px;
    max-width:90vw;
    max-height:80vh;
    overflow-y:auto;
  }
  .modal h3{
    font-family:'Fraunces',serif;
    font-style:italic;

  .dup-pair{
    background:var(--bg-2);
    border:1px solid var(--border);
    border-radius:4px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .dup-pair .t{font-size:12.5px; color:var(--text); margin-bottom:3px;}
  .dup-pair .t b{color:var(--brass-soft);}
  .dup-pair-actions{display:flex; gap:8px; margin-top:8px;}
  .btn-small{
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    padding:6px 11px;
    border-radius:3px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text-dim);

  .btn-small.primary{background:var(--brass); color:var(--nord0); border-color:var(--brass); font-weight:600;}
  .modal-close{
    display:block;
    margin:16px auto 0 auto;
    background:none;
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 18px;
    border-radius:3px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:12px;
  }
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--brass);
    color:var(--nord0);
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:9px 18px;

  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  @media (max-width:820px){
    .app{flex-direction:column;}
    .sidebar{
      width:100%; flex:none; border-right:none; border-bottom:1px solid var(--border);
      height:auto; position:static;
    }
    .book-list{max-height:220px;}
    .main{padding:22px 18px 40px;}
  }
  :focus-visible{outline:2px solid var(--brass); outline-offset:1px;}
</style>
</head>
<body>

<div class="app" id="app">

  <div class="sidebar">
    <div class="brand">
      <h1>Clippings</h1>
      <span id="fileStatus">no file loaded</span>
    </div>

    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Search notes, quotes, books…">
    </div>

    <div class="type-chips" id="typeChips">
      <div class="chip on" data-type="Highlight"><span class="dot"></span>Highlights</div>
      <div class="chip on" data-type="Note"><span class="dot"></span>Notes</div>
    </div>
    <div id="unclassifiedNote"></div>

    <div id="dupAlertWrap"></div>

    <div class="section-label">
      <span>Books</span>
      <button id="showAllBtn">show all</button>
    </div>
    <select id="bookSortSelect" class="book-sort-select">
      <option value="count">Most clippings</option>
      <option value="newest">Newest highlight first</option>
      <option value="oldest">Oldest highlight first</option>
      <option value="az">Title A–Z</option>
    </select>
    <div class="book-list" id="bookList"></div>

    <div class="sidebar-foot">
      <button class="btn-ghost" id="loadNewBtn">Load new file</button>
      <button class="btn-ghost" id="clearDataBtn">Clear saved data</button>
    </div>
  </div>

  <div class="main" id="mainArea">
    <!-- populated by JS -->
  </div>

</div>

<input type="file" id="fileInput" accept=".txt">
<div class="toast" id="toast"></div>

<script>
(function(){

/* ============ STATE ============ */
let allEntries = [];      // {book, author, type, locStart, locEnd, page, dateStr, dateObj, text, rawBookLine}
let booksIndex = {};       // key(bookline) -> {title, author, count, hue}
let merges = {};           // rawBookLine -> canonicalBookLine
let activeBook = null;      // canonical book key or null = all
let activeTypes = new Set(['Highlight','Note']);
let searchTerm = '';
let sortMode = 'date-desc';
let bookSortMode = 'count'; // 'count' | 'newest' | 'oldest' | 'az'
let dupSuggestions = [];
const RENDER_PAGE_SIZE = 150; // cap how many cards get built into the DOM at once
let renderLimit = RENDER_PAGE_SIZE;

const el = id => document.getElementById(id);

/* ============ PERSISTENCE ============ */
/* Uses the browser's localStorage so your library re-loads automatically
   next time you open this file — no network, no external storage, all local. */
async function saveRaw(text){
  try{ localStorage.setItem('clippings:rawtext', text); return true; }
  catch(e){ console.error('save raw failed', e); return false; }
}
async function loadRaw(){
  try{ return localStorage.getItem('clippings:rawtext'); }
  catch(e){ console.error('load raw failed', e); return null; }
}
async function saveMerges(){
  try{ localStorage.setItem('clippings:merges', JSON.stringify(merges)); }
  catch(e){ console.error('save merges failed', e); }
}
async function loadMerges(){
  try{ const v = localStorage.getItem('clippings:merges'); return v ? JSON.parse(v) : {}; }
  catch(e){ console.error('load merges failed', e); return {}; }
}
async function clearAllData(){
  try{ localStorage.removeItem('clippings:rawtext'); }catch(e){}
  try{ localStorage.removeItem('clippings:merges'); }catch(e){}
  location.reload();
}

/* ============ PARSING ============ */
function parseBookLine(line){
  line = line.trim();
  let author = '';
  let title = line;
  const m = line.match(/\(([^()]+)\)\s*$/);
  if(m){
    author = m[1].trim();
    title = line.slice(0, m.index).trim();
    const suffix = (' - ' + author).toLowerCase();
    if(title.toLowerCase().endsWith(suffix)){
      title = title.slice(0, title.length - suffix.length).trim();
    }
  }
  return {title: title || line, author};
}

const SPINE_COLORS = ['#8fbcbb','#88c0d0','#81a1c1','#5e81ac','#bf616a','#d08770','#ebcb8b','#a3be8c','#b48ead'];
function hueFor(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) % SPINE_COLORS.length; }
  return SPINE_COLORS[Math.abs(h) % SPINE_COLORS.length];
}

function reconstructEndLocation(startStr, endStr){
  if(endStr == null || endStr === '') return null;
  // Older Kindle exports abbreviate the end of a location range, dropping shared
  // leading digits, e.g. "151-53" means locations 151 to 153 (not 53).
  if(endStr.length >= startStr.length) return parseInt(endStr,10);
  const prefix = startStr.slice(0, startStr.length - endStr.length);
  return parseInt(prefix + endStr, 10);
}

function parseClippings(raw){
  let text = raw.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n');
  const chunks = text.split(/\n={5,}\n?/).map(c=>c.trim()).filter(Boolean);
  const entries = [];
  for(const chunk of chunks){
    const lines = chunk.split('\n');
    if(lines.length < 2) continue;
    const bookLine = lines[0].trim();
    const metaLine = lines[1].trim();
    const body = lines.slice(2).join('\n').trim();
    const {title, author} = parseBookLine(bookLine);

    // Modern format: "- Your Highlight on Location 188-190 | Added on <date>"
    // also covers "- Your Highlight on page 6 | location 161-162 | Added on <date>"
    const modernMatch = metaLine.match(/-\s*Your\s+(Highlight|Note|Bookmark)\b(?:\s+on\s+(.*?))?\s*\|\s*Added on\s*(.*)$/i);

    // Legacy format (pre-~2014 Kindles): "- Highlight Loc. 151-53 | Added on <date>"
    // no "Your", "Loc." instead of "Location", end-of-range digits abbreviated.
    const legacyMatch = metaLine.match(/-\s*(Highlight|Note|Bookmark)\s+Loc\.?\s*(\d+)(?:-(\d+))?\s*\|\s*Added on\s*(.*)$/i);

    let type, locStart=null, locEnd=null, page=null, dateStr='';

    if(modernMatch){
      type = modernMatch[1].charAt(0).toUpperCase() + modernMatch[1].slice(1).toLowerCase();
      const locPart = modernMatch[2] || '';
      dateStr = (modernMatch[3] || '').trim();
      const locM = locPart.match(/Location\s+(\d+)(?:-(\d+))?/i);
      if(locM){ locStart = parseInt(locM[1],10); locEnd = locM[2]?parseInt(locM[2],10):locStart; }
      const pageM = locPart.match(/page\s+([\w\d]+)/i);
      if(pageM){ page = pageM[1]; }
    } else if(legacyMatch){
      type = legacyMatch[1].charAt(0).toUpperCase() + legacyMatch[1].slice(1).toLowerCase();
      const startStr = legacyMatch[2];
      const endStr = legacyMatch[3];
      locStart = parseInt(startStr, 10);
      locEnd = endStr ? reconstructEndLocation(startStr, endStr) : locStart;
      dateStr = (legacyMatch[4] || '').trim();
    } else {
      // Unrecognized meta line format — never silently drop it, surface as "Unclassified".
      entries.push({
        rawBookLine: bookLine,
        book: title,
        author: author,
        type: 'Unclassified',
        locStart:null, locEnd:null, page:null,
        dateStr:'', dateObj:null,
        rawMeta: metaLine,
        text: body
      });
      continue;
    }

    let dateObj = null;
    if(dateStr){
      const d = new Date(dateStr);
      if(!isNaN(d.getTime())) dateObj = d;
    }

    // Bookmarks carry no text and this app doesn't track them — drop entirely.
    if(type === 'Bookmark') continue;

    entries.push({
      rawBookLine: bookLine,
      book: title,
      author: author,
      type: type,
      locStart, locEnd, page,
      dateStr, dateObj,
      text: body
    });
  }
  return entries;
}

/* Similarity between two book title strings, for duplicate detection */
function normWords(s){
  return s.toLowerCase()
    .replace(/[^a-z0-9\s]/g,' ')
    .split(/\s+/)
    .filter(w=>w.length>3);
}
function similarity(a,b){
  const wa = new Set(normWords(a));
  const wb = new Set(normWords(b));
  if(wa.size===0 || wb.size===0) return 0;
  let inter=0;
  for(const w of wa) if(wb.has(w)) inter++;
  return inter / Math.min(wa.size, wb.size);
}

function findDuplicateSuggestions(rawLines){
  const uniq = [...new Set(rawLines)];
  const sugg = [];
  for(let i=0;i<uniq.length;i++){
    for(let j=i+1;j<uniq.length;j++){
      if(merges[uniq[i]] === merges[uniq[j]] && merges[uniq[i]]) continue;
      const sim = similarity(uniq[i], uniq[j]);
      if(sim >= 0.55){
        sugg.push({a: uniq[i], b: uniq[j], sim});
      }
    }
  }
  return sugg;
}

/* canonical key for a raw book line, honoring merges */
function canon(rawLine){
  return merges[rawLine] || rawLine;
}

/* ============ BUILD INDEX ============ */
function rebuildIndex(){
  booksIndex = {};
  for(const e of allEntries){
    const key = canon(e.rawBookLine);
    if(!booksIndex[key]){
      const {title, author} = parseBookLine(key);
      booksIndex[key] = {title, author, count:0, hue: hueFor(key), minDate:null, maxDate:null};
    }
    const b = booksIndex[key];
    b.count++;
    if(e.dateObj){
      const t = e.dateObj.getTime();
      if(b.minDate===null || t < b.minDate) b.minDate = t;
      if(b.maxDate===null || t > b.maxDate) b.maxDate = t;
    }
  }
  const rawLines = allEntries.map(e=>e.rawBookLine);
  dupSuggestions = findDuplicateSuggestions(rawLines);
}

/* ============ RENDER: SIDEBAR ============ */
function renderTypeChips(){
  const wrap = el('typeChips');
  const hasUnclassified = allEntries.some(e=>e.type==='Unclassified');
  const existingChip = wrap.querySelector('[data-type="Unclassified"]');
  if(hasUnclassified && !existingChip){
    const chip = document.createElement('div');
    chip.className = 'chip on';
    chip.dataset.type = 'Unclassified';
    chip.innerHTML = '<span class="dot"></span>Unclassified';
    wrap.appendChild(chip);
    activeTypes.add('Unclassified');
  } else if(!hasUnclassified && existingChip){
    existingChip.remove();
    activeTypes.delete('Unclassified');
  }

  const noteWrap = el('unclassifiedNote');
  if(hasUnclassified){
    const n = allEntries.filter(e=>e.type==='Unclassified').length;
    noteWrap.innerHTML = `<div class="dup-alert" style="cursor:default;"><b>${n}</b> clipping${n>1?'s':''} in an unrecognized format — likely a non-English Kindle locale. They're shown under "Unclassified" so nothing is lost; tell Claude the raw text so support can be added.</div>`;
  } else {
    noteWrap.innerHTML = '';
  }

  document.querySelectorAll('.chip').forEach(chip=>{
    const t = chip.dataset.type;
    chip.classList.toggle('on', activeTypes.has(t));
    chip.onclick = ()=>{
      if(activeTypes.has(t)) activeTypes.delete(t); else activeTypes.add(t);
      renderTypeChips();
      renderBookList();
      renderMain();
    };
  });
}

function computeBookMatchCounts(){
  // Counts entries per book that pass the *current* type filter + search term,
  // so the sidebar list (and the counts shown in it) reflect what's actually visible.
  const counts = {};
  const t = searchTerm.toLowerCase();
  for(const e of allEntries){
    if(!activeTypes.has(e.type)) continue;
    if(searchTerm){
      const hit = e.text.toLowerCase().includes(t) || e.book.toLowerCase().includes(t) || e.author.toLowerCase().includes(t);
      if(!hit) continue;
    }
    const key = canon(e.rawBookLine);
    counts[key] = (counts[key] || 0) + 1;
  }
  return counts;
}

function renderBookList(){
  const wrap = el('bookList');
  wrap.innerHTML = '';
  const matchCounts = computeBookMatchCounts();
  const filtering = !!searchTerm;
  const keys = Object.keys(booksIndex)
    .filter(k => (matchCounts[k] || 0) > 0 || k === activeBook)
    .sort((a,b)=>{
      const A = booksIndex[a], B = booksIndex[b];
      if(bookSortMode === 'newest'){
        return (B.maxDate ?? -Infinity) - (A.maxDate ?? -Infinity);
      }
      if(bookSortMode === 'oldest'){
        // books with no dated entries sort to the end
        if(A.minDate===null && B.minDate===null) return 0;
        if(A.minDate===null) return 1;
        if(B.minDate===null) return -1;
        return A.minDate - B.minDate;
      }
      if(bookSortMode === 'az'){
        return A.title.localeCompare(B.title);
      }
      return B.count - A.count; // 'count' default
    });
  if(keys.length === 0){
    wrap.innerHTML = `<div style="color:var(--text-faint); font-size:12px; padding:10px 4px;">No books match "${escapeHtml(searchTerm)}"</div>`;
    return;
  }
  for(const key of keys){
    const b = booksIndex[key];
    const shownCount = filtering ? (matchCounts[key] || 0) : b.count;
    const row = document.createElement('div');
    row.className = 'book-row' + (activeBook===key ? ' active' : '');
    row.innerHTML = `
      <div class="spine" style="background:${b.hue}"></div>
      <div class="book-meta">
        <div class="book-title">${escapeHtml(b.title)}</div>
        ${b.author ? `<div class="book-author">${escapeHtml(b.author)}</div>` : ''}
      </div>
      <div class="book-count">${shownCount}</div>
    `;
    row.onclick = ()=>{ activeBook = key; renderBookList(); renderMain(); };
    wrap.appendChild(row);
  }
}

function renderDupAlert(){
  const wrap = el('dupAlertWrap');
  if(dupSuggestions.length === 0){ wrap.innerHTML=''; return; }
  wrap.innerHTML = `<div class="dup-alert" id="dupAlertBtn"><b>${dupSuggestions.length}</b> possible duplicate book${dupSuggestions.length>1?'s':''} found — review &amp; merge</div>`;
  el('dupAlertBtn').onclick = openMergeModal;
}

/* ============ RENDER: MAIN ============ */
function highlightMatch(text){
  if(!searchTerm) return escapeHtml(text);
  const esc = escapeHtml(text);
  const term = escapeHtml(searchTerm).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return esc.replace(new RegExp(term,'ig'), m=>`<mark>${m}</mark>`);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtLoc(e){
  if(e.type === 'Unclassified' && e.rawMeta) return e.rawMeta;
  const bits = [];
  if(e.page) bits.push('p.'+e.page);
  if(e.locStart!=null) bits.push('loc '+e.locStart+(e.locEnd && e.locEnd!==e.locStart ? '–'+e.locEnd : ''));
  return bits.join('  ·  ');
}
function fmtDate(e){
  if(e.type === 'Unclassified') return '';
  if(e.dateObj) return e.dateObj.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
  return e.dateStr || '';
}

function getFiltered(){
  let list = allEntries.filter(e => activeTypes.has(e.type));
  if(activeBook) list = list.filter(e => canon(e.rawBookLine) === activeBook);
  if(searchTerm){
    const t = searchTerm.toLowerCase();
    list = list.filter(e =>
      e.text.toLowerCase().includes(t) ||
      e.book.toLowerCase().includes(t) ||
      e.author.toLowerCase().includes(t)
    );
  }
  list = list.slice();
  if(sortMode==='date-desc') list.sort((a,b)=>(b.dateObj?.getTime()||0)-(a.dateObj?.getTime()||0));
  else if(sortMode==='date-asc') list.sort((a,b)=>(a.dateObj?.getTime()||0)-(b.dateObj?.getTime()||0));
  else if(sortMode==='loc-asc') list.sort((a,b)=>(a.locStart??1e9)-(b.locStart??1e9));
  else if(sortMode==='book') list.sort((a,b)=>a.book.localeCompare(b.book) || (a.locStart??0)-(b.locStart??0));
  else if(sortMode==='size-desc') list.sort((a,b)=>clipSize(b)-clipSize(a));
  else if(sortMode==='size-asc') list.sort((a,b)=>clipSize(a)-clipSize(b));
  return list;
}

// Returns the size of a clipping's text, used for size-based sorting.
// Counts words (whitespace-separated tokens) since that's the more
// meaningful measure of a highlight's "length" for a reader; falls back to
// 0 for entries with no text (e.g. bookmark markers).
function clipSize(e){
  if(!e.text) return 0;
  const trimmed = e.text.trim();
  if(!trimmed) return 0;
  return trimmed.split(/\s+/).length;
}

function renderStats(){
  const total = allEntries.length;
  const h = allEntries.filter(e=>e.type==='Highlight').length;
  const n = allEntries.filter(e=>e.type==='Note').length;
  const books = Object.keys(booksIndex).length;
  const scope = activeBook ? booksIndex[activeBook]?.title : 'All Books';
  return `
    <div class="stats-bar">
      <div>
        <h2>${escapeHtml(scope || 'All Books')}</h2>
        <div class="sub">${total} clippings across ${books} book${books===1?'':'s'}</div>
      </div>
      <div class="stamp-row">
        <div class="stamp"><span class="n">${h}</span><span class="l">Highlights</span></div>
        <div class="stamp"><span class="n">${n}</span><span class="l">Notes</span></div>
      </div>
    </div>
  `;
}

function renderMain(keepRenderLimit){
  const main = el('mainArea');
  if(allEntries.length === 0){
    main.innerHTML = renderDropzone();
    bindDropzone();
    return;
  }
  if(!keepRenderLimit) renderLimit = RENDER_PAGE_SIZE;
  const filtered = getFiltered();
  const visible = filtered.slice(0, renderLimit);
  let html = renderStats();
  html += `
    <div class="toolbar">
      <select id="sortSelect">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="loc-asc">Location, ascending</option>
        <option value="book">Book, then location</option>
        <option value="size-desc">Longest first</option>
        <option value="size-asc">Shortest first</option>
      </select>
      <div class="right">
        <button class="icon-btn" id="copyAllBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="1"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>
          Copy ${filtered.length} as text
        </button>
      </div>
    </div>
  `;
  if(filtered.length === 0){
    html += `<div class="no-results">No clippings match your filters. Try clearing the search or type filters.</div>`;
  } else {
    if(filtered.length > visible.length){
      html += `<div class="dup-alert" style="cursor:default; margin-bottom:14px;">
        Showing <b>${visible.length}</b> of <b>${filtered.length}</b> matches — narrow your search to see fewer, or
        <button id="showMoreBtn" style="background:none;border:none;color:var(--brass);cursor:pointer;font-family:'Inter',sans-serif;font-size:11.5px;text-decoration:underline;padding:0;">load ${Math.min(RENDER_PAGE_SIZE, filtered.length - visible.length)} more</button>.
      </div>`;
    }
    html += `<div class="clip-list">`;
    for(const e of visible){
      const showBook = !activeBook;
      html += `
        <div class="clip-card">
          <div class="clip-top">
            <div>
              ${showBook ? `<div class="clip-book">${escapeHtml(e.book)}</div>` : ''}
              ${showBook && e.author ? `<div class="clip-author">${escapeHtml(e.author)}</div>` : ''}
            </div>
            <div class="type-tab ${e.type}">${e.type}</div>
          </div>
          ${e.text ? `<div class="clip-text">${highlightMatch(e.text)}</div>`
                    : `<div class="clip-text empty">No text — ${e.type.toLowerCase()} marker only.</div>`}
          <div class="clip-bottom">
            <div class="clip-loc">${fmtLoc(e)}${fmtLoc(e) && fmtDate(e) ? '  ·  ' : ''}${fmtDate(e)}</div>
            <button class="clip-copy" data-copy="${encodeURIComponent(e.text || e.book)}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="1"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>
              Copy
            </button>
          </div>
        </div>
      `;
    }
    html += `</div>`;
  }
  main.innerHTML = html;

  el('sortSelect').value = sortMode;
  el('sortSelect').onchange = (ev)=>{ sortMode = ev.target.value; renderMain(); };
  el('copyAllBtn').onclick = ()=> copyFilteredAsText(filtered);
  const moreBtn = document.getElementById('showMoreBtn');
  if(moreBtn){
    moreBtn.onclick = ()=>{
      renderLimit += RENDER_PAGE_SIZE;
      renderMain(true);
    };
  }
  document.querySelectorAll('.clip-copy').forEach(btn=>{
    btn.onclick = ()=> copyText(decodeURIComponent(btn.dataset.copy));
  });
}

function renderDropzone(){
  return `
    <div class="dropzone" id="dropzone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M15 4v5h5"/><path d="M8 13h8M8 17h5"/></svg>
      <h3>Your library is empty</h3>
      <p>Drag in your <b>My Clippings.txt</b> file from your Kindle,<br>or choose it below. Everything stays on this device.</p>
      <label class="file-label" for="fileInput">Choose file…</label>
    </div>
  `;
}
function bindDropzone(){
  const dz = el('dropzone');
  if(!dz) return;
  ['dragenter','dragover'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e=>{
    const f = e.dataTransfer.files[0];
    if(f) handleFile(f);
  });
}

/* ============ MERGE MODAL ============ */
function openMergeModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Possible duplicate books</h3>
      <div id="dupList"></div>
      <button class="modal-close" id="closeModal">Close</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e)=>{ if(e.target===overlay) overlay.remove(); };
  el('closeModal').onclick = ()=> overlay.remove();

  const listWrap = overlay.querySelector('#dupList');
  if(dupSuggestions.length===0){
    listWrap.innerHTML = `<div style="color:var(--text-faint); font-size:13px;">No duplicates detected.</div>`;
  }
  dupSuggestions.forEach((pair, idx)=>{
    const pa = parseBookLine(canon(pair.a));
    const pb = parseBookLine(canon(pair.b));
    const div = document.createElement('div');
    div.className = 'dup-pair';
    div.innerHTML = `
      <div class="t">1. <b>${escapeHtml(pa.title)}</b> ${pa.author ? '— '+escapeHtml(pa.author):''}</div>
      <div class="t">2. <b>${escapeHtml(pb.title)}</b> ${pb.author ? '— '+escapeHtml(pb.author):''}</div>
      <div class="dup-pair-actions">
        <button class="btn-small primary" data-a="${idx}" data-choice="a">Merge → use title 1</button>
        <button class="btn-small" data-a="${idx}" data-choice="b">Merge → use title 2</button>
        <button class="btn-small" data-a="${idx}" data-choice="ignore">Not the same</button>
      </div>
    `;
    listWrap.appendChild(div);
  });
  listWrap.querySelectorAll('button').forEach(btn=>{
    btn.onclick = async ()=>{
      const i = parseInt(btn.dataset.a,10);
      const pair = dupSuggestions[i];
      const choice = btn.dataset.choice;
      if(choice === 'a'){
        merges[canon(pair.b)] = canon(pair.a);
      } else if(choice === 'b'){
        merges[canon(pair.a)] = canon(pair.b);
      }
      await saveMerges();
      rebuildIndex();
      if(activeBook && !booksIndex[activeBook]) activeBook = null;
      renderBookList();
      renderDupAlert();
      renderMain();
      overlay.remove();
      showToast(choice==='ignore' ? 'Marked as not duplicates' : 'Books merged');
    };
  });
}

/* ============ COPY / EXPORT ============ */
function showToast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 1800);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); showToast('Copied to clipboard'); }
  catch(e){ showToast('Could not copy — try selecting manually'); }
}
function copyFilteredAsText(list){
  const parts = list.map(e=>{
    const head = `${e.book}${e.author ? ' — '+e.author:''}`;
    const loc = fmtLoc(e);
    const date = fmtDate(e);
    const body = e.text || `[${e.type} — no text]`;
    return `${head}\n${e.type} · ${loc}${loc&&date?' · ':''}${date}\n${body}`;
  });
  copyText(parts.join('\n\n---\n\n'));
}

/* ============ FILE HANDLING ============ */
async function handleFile(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    const raw = e.target.result;
    await ingest(raw);
    const ok = await saveRaw(raw);
    if(!ok){
      showToast('Loaded, but too large to auto-save — you\'ll need to reload it next time');
    }
  };
  reader.readAsText(file, 'utf-8');
}

async function ingest(raw){
  allEntries = parseClippings(raw);
  merges = await loadMerges();
  rebuildIndex();
  activeBook = null;
  searchTerm = '';
  el('searchInput').value = '';
  el('fileStatus').textContent = allEntries.length + ' clippings loaded';
  renderTypeChips();
  renderBookList();
  renderDupAlert();
  renderMain();
}

/* ============ INIT / EVENTS ============ */
el('fileInput').addEventListener('change', (e)=>{
  const f = e.target.files[0];
  if(f) handleFile(f);
});
el('loadNewBtn').onclick = ()=> el('fileInput').click();
el('clearDataBtn').onclick = ()=>{
  if(confirm('This clears your saved clippings data from this browser. Continue?')) clearAllData();
};
el('showAllBtn').onclick = ()=>{ activeBook = null; renderBookList(); renderMain(); };
el('bookSortSelect').value = bookSortMode;
el('bookSortSelect').addEventListener('change', (e)=>{
  bookSortMode = e.target.value;
  renderBookList();
});
let searchDebounceTimer = null;
el('searchInput').addEventListener('input', (e)=>{
  const value = e.target.value.trim();
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(()=>{
    searchTerm = value;
    renderBookList();
    renderMain();
  }, 120);
});

renderTypeChips();

(async function init(){
  el('mainArea').innerHTML = `<div class="no-results">Loading your library…</div>`;
  const saved = await loadRaw();
  if(saved){
    await ingest(saved);
  } else {
    el('mainArea').innerHTML = renderDropzone();
    bindDropzone();
  }
})();

})();
</script>
</body>
</html>
